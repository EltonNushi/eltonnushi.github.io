<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableMaster Pro Booking Conduit</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; }
        .tablemaster-widget-container {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .tablemaster-widget-container h2 { margin-top: 0; color: #ff2d55; font-size: 24px; font-weight: bold; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #333; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: white; font-family: inherit;
        }
        .form-group textarea { resize: vertical; }
        .time-slots-grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
        .time-chip-item {
            padding: 10px 4px; font-size: 12px; font-weight: 600; text-align: center; background: #f5f5f7; color: #1d1d1f; border: 1px solid transparent; border-radius: 20px; cursor: pointer; transition: background-color 0.12s;
        }
        .time-chip-item:hover { background: #e8e8ed; border-color: #ccc; }
        .time-chip-item.active-selected {
            background: #ff2d55 !important; color: white !important; border-color: #ff2d55 !important; box-shadow: 0 2px 8px rgba(255, 45, 85, 0.35);
        }
        .conditional-wrapper { display: none; }
        .alert-label { color: #ff2d55 !important; }
        .form-group input[id="occasionOtherDetails"], .form-group input[id="allergenNotes"] { border: 1px solid #ff2d55; }
        .submit-button {
            width: 100%; padding: 12px; background: #ff2d55; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;
        }
        .submit-button:hover { background: #e02449; }
    </style>
</head>
<body>

<div class="tablemaster-widget-container">
    <h2>Book a Table</h2>
    <form id="bookingForm" onsubmit="executeCloudKitBookingSubmit(event)">
        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required placeholder="John"></div>
        <div class="form-group"><label>Surname</label><input type="text" id="surname" required placeholder="Smith"></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="guestEmail" required placeholder="john.smith@example.com"></div>
        <div class="form-group"><label>Phone Number</label><input type="tel" id="phoneDigits" required placeholder="07123 456789"></div>
        <div class="form-group"><label>Party Size</label><input type="number" id="partySize" min="1" max="100" value="2" required></div>
        <div class="form-group"><label>Arrival Date</label><input type="date" id="reservationDay" required onchange="evaluateOperationalHoursGridFirewall()"></div>
        <div class="form-group"><label>Available Seating Slots</label><input type="hidden" id="selectedTimeSlot" required><div id="dynamicTimeSlotsContainer" class="time-slots-grid-container"></div></div>

        <div class="form-group">
            <label>Special Occasion</label>
            <select id="visitOccasion" onchange="toggleOtherOccasionInputField()">
                <option value="Standard Dining">Standard Dining</option>
                <option value="Birthday">Birthday 🎂</option>
                <option value="Anniversary">Anniversary 💍</option>
                <option value="Other">Other (Please Specify) 📝</option>
            </select>
        </div>
        <div id="otherOccasionWrapper" class="form-group conditional-wrapper"><label class="alert-label">Specify Occasion Details</label><input type="text" id="occasionOtherDetails"></div>

        <div class="form-group">
            <label>Food Allergies / Intolerances?</label>
            <select id="hasAllergySelect" onchange="toggleAllergenInputField()">
                <option value="0">No, none of our guests have allergies</option>
                <option value="1">Yes, members of our party have allergies ⚠️</option>
            </select>
        </div>
        <div id="allergenNotesWrapper" class="form-group conditional-wrapper"><label class="alert-label">Specify Allergen Details</label><input type="text" id="allergenNotes"></div>
        <div class="form-group"><label>Special Requests / Notes</label><textarea id="specialRequests" placeholder="e.g. Prefer window seating..." rows="3"></textarea></div>

        <button type="submit" class="submit-button">Request Reservation</button>
    </form>
</div>


<script>
    // 🧠 DYNAMIC TENANT EXTRACTOR: Resolves query strings instantly
    const urlParams = new URLSearchParams(window.location.search);
    const activeRestaurantTenantID = urlParams.get('venue') || 'unassigned_tenant_gate';

    const venueOperationalHoursRuleMap = [
        { dayIndex: 1, open: 12, close: 22, isClosed: false }, // Sun
        { dayIndex: 2, open: 16, close: 22, isClosed: false }, // Mon
        { dayIndex: 3, open: 16, close: 22, isClosed: false }, // Tue
        { dayIndex: 4, open: 16, close: 22, isClosed: false }, // Wed
        { dayIndex: 5, open: 16, close: 22, isClosed: false }, // Thu (Closes at 10 PM)
        { dayIndex: 6, open: 12, close: 23, isClosed: false }, // Fri (Closes at 11 PM)
        { dayIndex: 7, open: 12, close: 23, isClosed: false }  // Sat (Closes at 11 PM)
    ];

    function toggleOtherOccasionInputField() {
        const picker = document.getElementById('visitOccasion').value;
        document.getElementById('otherOccasionWrapper').style.display = picker === 'Other' ? 'block' : 'none';
    }

    function toggleAllergenInputField() {
        const allergy = document.getElementById('hasAllergySelect').value;
        document.getElementById('allergenNotesWrapper').style.display = allergy === '1' ? 'block' : 'none';
    }

    function evaluateOperationalHoursGridFirewall() {
        const dayInput = document.getElementById('reservationDay').value;
        const containerGrid = document.getElementById('dynamicTimeSlotsContainer');
        containerGrid.innerHTML = "";
        if (!dayInput) return;

        const selectedDateObj = new Date(dayInput);
        let weekdayIndex = selectedDateObj.getDay() + 1;
        const rule = venueOperationalHoursRuleMap.find(r => r.dayIndex === weekdayIndex) || { open: 16, close: 22 };

        for (let hour = rule.open; hour < rule.close; hour++) {
            ["00", "30"].forEach(minute => {
                if ((weekdayIndex === 6 || weekdayIndex === 7) && hour === 22 && minute === "30") return; // 22:30 firewall cut-off
                const timeStringValue = String(hour).padStart(2, '0') + ":" + minute;
                const chipNode = document.createElement('div');
                chipNode.className = "time-chip-item";
                chipNode.innerText = timeStringValue;
                chipNode.onclick = function() {
                    document.querySelectorAll('.time-chip-item').forEach(c => c.classList.remove('active-selected'));
                    chipNode.classList.add('active-selected');
                    document.getElementById('selectedTimeSlot').value = timeStringValue;
                };
                containerGrid.appendChild(chipNode);
            });
        }
    }



    function executeCloudKitBookingSubmit(event) {
        if (event) event.preventDefault();
        const dayInput = document.getElementById('reservationDay').value;
        const timeSlotInput = document.getElementById('selectedTimeSlot').value;
        if (!dayInput || !timeSlotInput) { alert("⚠️ Please select an arrival date and open time slot capsule."); return; }

        const submitButton = event.target.querySelector('.submit-button');
        submitButton.disabled = true;
        submitButton.innerText = 'Transmitting...';

        const resDate = new Date(dayInput + "T" + timeSlotInput + ":00").getTime();

        // 📦 Pack variables into a clean payload structure to pass to your proxy script
        const localFormPayload = {
            restaurantID: activeRestaurantTenantID,
            firstName: document.getElementById('firstName').value,
            surname: document.getElementById('surname').value,
            email: document.getElementById('guestEmail').value,
            phone: document.getElementById('phoneDigits').value,
            partySize: parseInt(document.getElementById('partySize').value),
            resDate: resDate,
            occasion: document.getElementById('visitOccasion').value,
            occasionDetails: document.getElementById('occasionOtherDetails').value,
            hasAllergy: parseInt(document.getElementById('hasAllergySelect').value),
            allergenNotes: document.getElementById('allergenNotes').value,
            notes: document.getElementById('specialRequests').value
        };

        // 📡 ROUTE DIRECTLY TO YOUR SECURE LIVE NODE.JS ENGINE ON RENDER
  fetch('https://onrender.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(localFormPayload)
  })

        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("🎉 Reservation Request Sent Successfully!");
                document.getElementById('bookingForm').reset();

                // Reset active styles on time selection chips
                document.querySelectorAll('.time-chip-item').forEach(chip => chip.className = 'time-chip-item');
                document.getElementById('selectedTimeSlot').value = "";

                submitButton.disabled = false;
                submitButton.innerText = 'Request Reservation';

                toggleOtherOccasionInputField();
                toggleAllergenInputField();
                evaluateOperationalHoursGridFirewall();
            } else {
                alert("⚠️ Transmission Failure: " + JSON.stringify(data.error));
                submitButton.disabled = false;
                submitButton.innerText = 'Request Reservation';
            }
        })
        .catch(err => {
            alert("⚠️ Network Connection Failure: " + err.message);
            submitButton.disabled = false;
            submitButton.innerText = 'Request Reservation';
        });
    }


    // ✅ FIXED: Seeding initial uniform today values securely into the input block element
    const todayRawObj = new Date();
    const localYYYY = todayRawObj.getFullYear();
    const localMM = String(todayRawObj.getMonth() + 1).padStart(2, '0');
    const localDD = String(todayRawObj.getDate()).padStart(2, '0');

    document.getElementById('reservationDay').value = localYYYY + "-" + localMM + "-" + localDD;
    evaluateOperationalHoursGridFirewall();
</script>
