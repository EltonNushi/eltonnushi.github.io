<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableMaster Pro Booking Conduit</title>
    <style>
        :root { --accent-color: #ff2d55; --bg-dark: #000000; --panel-dark: #1c1c1e; --text-light: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: transparent; color: var(--text-light); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .tablemaster-widget-container { width: 100%; max-width: 450px; background: var(--panel-dark); padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); box-sizing: border-box; }
        h2 { text-align: center; color: var(--accent-color); margin-top: 0; font-size: 22px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #a1a1a6; }
        input, select, textarea { width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; }
        .time-chips-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 5px; }
        .time-chip-item { padding: 10px 5px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .time-chip-item:hover { border-color: var(--accent-color); }
        .time-chip-item.active { background: var(--accent-color); border-color: var(--accent-color); color: #fff; font-weight: bold; }
        .submit-button { width: 100%; padding: 14px; background: var(--accent-color); border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .submit-button:disabled { background: #3a3a3c; color: #8e8e93; cursor: not-allowed; }
        .conditional-block { display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="tablemaster-widget-container">
    <h2>Request Table Reservation</h2>
    <form id="bookingForm" onsubmit="executeCloudKitBookingSubmit(event)">

        <div class="form-group">
            <label for="reservationDay">Arrival Date</label>
            <input type="date" id="reservationDay" required onchange="evaluateOperationalHoursGridFirewall()">
        </div>

        <div class="form-group">
            <label>Select Arrival Time</label>
            <div class="time-chips-grid" id="timeGrid">
                <!-- Time chips generated dynamically by logic engine below -->
            </div>
            <input type="hidden" id="selectedTimeSlot" required>
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required placeholder="John">
            </div>
            <div>
                <label for="surname">Surname</label>
                <input type="text" id="surname" required placeholder="Dough">
            </div>
        </div>

        <div class="form-group">
            <label for="guestEmail">Email Address</label>
            <input type="email" id="guestEmail" required placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label for="phoneDigits">Mobile Number</label>
            <input type="tel" id="phoneDigits" required placeholder="07123 456789">
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label for="partySize">Guests / Covers</label>
                <select id="partySize">
                    <option value="1">1 Person</option>
                    <option value="2" selected>2 People</option>
                    <option value="3">3 People</option>
                    <option value="4">4 People</option>
                    <option value="5">5 People</option>
                    <option value="6">6 People</option>
                </select>
            </div>
            <div>
                <label for="visitOccasion">Special Occasion</label>
                <select id="visitOccasion" onchange="toggleOtherOccasionInputField()">
                    <option value="None">Standard Dining</option>
                    <option value="Birthday">Birthday Celebration</option>
                    <option value="Anniversary">Anniversary</option>
                    <option value="Other">Other Occasion</option>
                </select>
            </div>
        </div>

        <div class="form-group conditional-block" id="occasionDetailsBlock">
            <label for="occasionOtherDetails">Occasion Description</label>
            <input type="text" id="occasionOtherDetails" placeholder="e.g. Graduation Dinner">
        </div>

        <div class="form-group">
            <label for="hasAllergySelect">Food Allergies / Intolerances?</label>
            <select id="hasAllergySelect" onchange="toggleAllergenInputField()">
                <option value="0">No, none of our guests have allergies</option>
                <option value="1">Yes, a member of our party has allergies</option>
            </select>
        </div>

        <div class="form-group conditional-block" id="allergyNotesBlock">
            <label for="allergenNotes">Allergen Safety Specifications</label>
            <input type="text" id="allergenNotes" placeholder="e.g. Peanut allergy, gluten intolerant">
        </div>

        <div class="form-group">
            <label for="specialRequests">Special Requests / Notes</label>
            <textarea id="specialRequests" rows="2" placeholder="e.g. Prefer window seating..."></textarea>
        </div>

        <button type="submit" class="submit-button">Request Reservation</button>
    </form>
</div>

<script>
    // 📡 DYNAMIC TENANT ID EXTRACTION ENGINE
    const urlParams = new URLSearchParams(window.location.search);
    const activeRestaurantTenantID = urlParams.get('venue') || 'unassigned_tenant_gate';

    // Auto-seed tomorrow's date parameter by default grid mapping rules
    window.addEventListener('DOMContentLoaded', () => {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('reservationDay').value = tomorrow.toISOString().split('T')[0];
        evaluateOperationalHoursGridFirewall();
    });

    function toggleOtherOccasionInputField() {
        const select = document.getElementById('visitOccasion').value;
        document.getElementById('occasionDetailsBlock').style.display = (select === 'Other') ? 'block' : 'none';
    }

    function toggleAllergenInputField() {
        const select = document.getElementById('hasAllergySelect').value;
        document.getElementById('allergyNotesBlock').style.display = (select === '1') ? 'block' : 'none';
    }

    // Dynamic rendering engine mapping active table slots chips
    function evaluateOperationalHoursGridFirewall() {
        const grid = document.getElementById('timeGrid');
        grid.innerHTML = '';

        const timeSlots = ["12:00", "12:30", "13:00", "13:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"];

        timeSlots.forEach(time => {
            const chip = document.createElement('div');
            chip.className = 'time-chip-item';
            chip.innerText = time;
            chip.onclick = () => {
                document.querySelectorAll('.time-chip-item').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                document.getElementById('selectedTimeSlot').value = time;
            };
            grid.appendChild(chip);
        });
    }

    // =========================================================================
    // 📡 DYNAMIC NODE ENGINE SUBMISSION CONDUIT (VERIFIED PACKET PATTERNS)
    // =========================================================================
    function executeCloudKitBookingSubmit(event) {
        if (event) event.preventDefault();
        const dayInput = document.getElementById('reservationDay').value;
        const timeSlotInput = document.getElementById('selectedTimeSlot').value;
        if (!dayInput || !timeSlotInput) { alert("⚠️ Please select an arrival date and open time slot capsule."); return; }

        const submitButton = event.target.querySelector('.submit-button');
        submitButton.disabled = true;
        submitButton.innerText = 'Transmitting...';

        const resDate = new Date(dayInput + "T" + timeSlotInput + ":00").getTime();

        const localFormPayload = {
            restaurantID: activeRestaurantTenantID,
            firstName: document.getElementById('firstName').value,
            surname: document.getElementById('surname').value,
            email: document.getElementById('guestEmail').value,
            phone: document.getElementById('phoneDigits').value,
            partySize: parseInt(document.getElementById('partySize').value),
            resDate: resDate,
            occasion: document.getElementById('visitOccasion').value,
            occasionDetails: document.getElementById('occasionOtherDetails').value,
            hasAllergy: parseInt(document.getElementById('hasAllergySelect').value),
            allergenNotes: document.getElementById('allergenNotes').value,
            notes: document.getElementById('specialRequests').value
        };

        // 📡 Transits data records directly to your secure Render cloud server engine
        fetch('https://onrender.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(localFormPayload)
        })
        .then(response => response.text())
        .then(textData => {
            let data;
            try { data = JSON.parse(textData); } catch (e) { data = { success: textData.includes("successfully") || textData.includes("true") }; }

            if (data.success || textData.includes("successfully")) {
                alert("🎉 Reservation Request Sent Successfully! Your table allocation is now pending review on the TableMaster Pro ledger.");
                document.getElementById('bookingForm').reset();
                document.querySelectorAll('.time-chip-item').forEach(c => c.classList.remove('active'));
                document.getElementById('selectedTimeSlot').value = "";

                submitButton.disabled = false;
                submitButton.innerText = 'Request Reservation';
                toggleOtherOccasionInputField();
                toggleAllergenInputField();
                evaluateOperationalHoursGridFirewall();
            } else {
                alert("⚠️ Transmission Failure: " + textData);
                submitButton.disabled = false;
                submitButton.innerText = 'Request Reservation';
            }
        })
        .catch(err => {
            alert("⚠️ Network Connection Failure: " + err.message);
            submitButton.disabled = false;
            submitButton.innerText = 'Request Reservation';
        });
    }
</script>
</body>
</html>
